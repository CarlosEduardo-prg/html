<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formúlarios</title>
</head>
<body>
    <h1>Exemplo de Formúlarios</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="imasc"><label for="imasc">Masculino</label> <br>
            <input type="radio" name="sexo" id="ifemi"><label for="ifemi">Feminino</label> <br>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut" checked><label for="iesfut"> Futebol</label> <br>
            <input type="checkbox" name="esbas" id="iesbas"><label for="iesbas"> Basquete</label> <br>
            <input type="checkbox" name="esten" id="iesten"><label for="iesten"> Tênis </label><br>
            <input type="checkbox" name="esvol" id="iesvol"><label for="iesvol"> Vôlei </label><br>
            <input type="checkbox" name="esnat" id="iesnat" checked><label for="iesnat"> Natação </label><br>
        </fieldset>

        <p>
           <input type="submit" value="Enviar">
           <input type="reset" value="Limpar">

        </p>
    </form>
    
</body>
</html>
