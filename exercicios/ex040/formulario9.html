<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formúlario</title>
</head>
<body>
    <h1>Exemplo de Formúlario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="inum">Satisfação</label>
            <input type="range" name="num" id="inum" min="0" max="5" oninput="inumero.innerHTML = Number(inum.value)">
            <output id="inumero">3</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    
</body>
</html>
