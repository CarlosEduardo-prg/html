<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 2</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif, Times, serif;
        }

        table {
            width: 500px;
            height: 150px;
            border-collapse: collapse;
        }

        caption {
            background-color: darkgray;
            font-weight: bold;
            font-size: 1.5em;
            padding: 10px;
        }

        td {
            border: 1px solid black;
            text-align: left;
            padding: 10px;
        }

        th {
            border: 1px solid black;
            padding: 10px;
        }

        .num {
            text-align: right;
        }

        thead, tfoot {
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <table>
        <caption>
            População das unidades federativas
        </caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">46 919 049</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">26 476 378</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">20 168 266</td>
            </tr>
            <tr>
                <td>Parána</td>
                <td class="num">15 356 345</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td class="num">43 456 646</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="num">32 435 422</td>
            </tr>
        </tbody>
        <tfoot>
            <th scope="row">Total de Habitantes</th>
            <td>180 434 567</td>
        </tfoot>
    </table>
    
</body>
</html>
