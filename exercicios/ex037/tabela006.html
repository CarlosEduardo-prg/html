<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            background-color: darkgray;
            padding: 10px;
            font-size: 1.3em;
        }

        td, th {
            border: 1px solid black;
            padding: 5px;
        }
        
        td, .media1 {
            text-align: center;
        }

        .media {
            text-align: left;
        }

        .area {
            background-color: white;
            color: black;
        }

        .materia {
            text-align: left;
        }

        th {
            background-color: gray;
            color: white;
        }

    </style>
</head>
<body>
    <h1>Tabela Desafio</h1>
    <table>

        <caption>Média final por área</caption>

        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            
            <tr>
                <th rowspan="4" class="area" scope="rowgroup">Exatas</th>
                <td class="materia">Matemática</td>
                <td>5.0</td>
                <td>7.0</td>
                <td>6.0</td>
            </tr>
            <tr>
                
                <td class="materia">Física</td>
                <td>8.0</td>
                <td>9.5</td>
                <td>9.5</td>
            </tr>
            <tr>
                
                <td class="materia">Química</td>
                <td>3.0</td>
                <td>1.5</td>
                <td>2.5</td>
            </tr>
            <tr>
                
                <td class="materia">Biologia</td>
                <td>4.5</td>
                <td>3.0</td>
                <td>4.0</td>
            </tr>
            <tr>
                <th colspan="4" class="media" scope="row">Média de Exatas</th>
                <th class="media1">5.5</th>
            </tr>
            <tr>
                <th rowspan="2" class="area" scope="rowgroup">Humanas</th>
                <td class="materia">Geografia</td>
                <td>7.0</td>
                <td>8.0</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td class="materia">História</td>
                <td>9.0</td>
                <td>6.0</td>
                <td>7.5</td>
            </tr>
            <tr>
                <th colspan="4" class="media" scope="row">Média de Humanas</th>
                <th class="media1">7.5</th>
                
            </tr>
        </tbody>

    </table>
    
</body>
</html>
