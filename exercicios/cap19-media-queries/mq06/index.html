<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <main>

        <section class="imagem">
            <img src="imagens/padrao.jpg" alt="Imagem enfeite">
        </section>

        <section class="inp">

            <h1>login</h1>

            <form action="cadastro.php" method="post" autocomplete="on">

                <legend>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</legend>
        
                    <p class="la">
                        <label for="isuario">#</label>
                        <input class="login" type="email" name="usuario" id="isuario">
                    </p>
                    
                    <p>
                        <label for="isenha">#</label>
                        <input class="login" type="password" name="senha" id="isenha">
                    </p>
                    
                    <p>
                        <input class="botoes" type="submit" value="Enviar">
                    </p>
                    
                    <p>
                        <input id="esqueci" class="botoes" type="submit" value="Esqueci a senha (icone)" >
                    </p>
                    
                
            </form>
        </section>
    </main>
</body>
</html>
