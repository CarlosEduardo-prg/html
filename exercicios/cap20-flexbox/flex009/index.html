<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        div.container {
            background-color: lightpink;
            display: flex;
            flex-flow: row nowrap;
            align-items: flex-start;
        }

        div.item {
            background-color: lightseagreen;
            border: 1px solid black;
            flex-basis: 150px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Conteudo maior</div>
        <div class="item">C</div>
        <div class="item">Um conteudo um pouco maior</div>
        <div class="item">E</div>
        <div class="item">Um conteudo muito maior, que vai ocupar mais espaço</div>
        <div class="item">G</div>
    </div>
</body>
</html>
