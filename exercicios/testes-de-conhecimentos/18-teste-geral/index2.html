<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto</title>
    <style>

        hr {
            width: 300px;
           margin: 0px;
        }

        div {
            width: 300px;
        }

        div:hover > p {
            display: block;
            background-color: red;
            color: white;
            width: 300px;
        }

        div:hover {
            color: red;
        }

        div > p {
            display: none;
        }

    </style>
</head>
<body>
    <h1>Texto escondido</h1>

    Passe o mouse sobre o texto abaixo
    <br>
    <br>
    <br>
    <hr>
    <div>
       Passe o mouse aqui
       <p>Jesus te ama</p>
    </div>

    
</body>
</html>
