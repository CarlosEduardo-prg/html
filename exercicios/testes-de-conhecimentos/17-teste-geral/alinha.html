<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Alinhamento</title>
    <style>

        .container {
            height: 90vh;
            background-color: purple;
            position: relative;
        }

        .conteudo {
            background-color: yellow;
            max-width: 200px;
            max-height: 200px;
            padding: 20px;
            text-align: center;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <h1>Alinhando blocos</h1>
    <section class="container"> 
        <section class="conteudo">

        </section>
    </section>
    
</body>
</html>
