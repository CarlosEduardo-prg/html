<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Geral 2</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        div.container {
            background-color: lightblue;
            display: flex;
            height: 400px;
            flex-flow: row nowrap;
            align-items: flex-start;
        }

        div.item {
            background-color: limegreen;
            border: 1px solid black;
            padding: 40px;
            text-align: center;
        }

        div#cx1 {
            order: 0;
            /*flex-basis: 200px;
            flex-grow: 1;
            flex-shrink: 0;*/
            flex: 1 0 200px;
        }

        div#cx2 {
            order: 3;
            /*flex-basis: 250px;
            flex-grow: 0 ;
            flex-shrink: 1 ;*/
            flex: 0 1 250px;
        }

        div#cx3 {
            order: -3;
            /*flex-basis: 150px;
            flex-grow: 3 ;
            flex-shrink: 3 ;*/
            flex: 3 3 150px;
        }
    </style>
</head>
<body>
    <h1>Aplicando flexbox nos filhos</h1>
    <div class="container">
        <div class="item" id="cx1">A</div>
        <div class="item" id="cx2">B</div>
        <div class="item" id="cx3">C</div>
    </div>
</body>
</html>
