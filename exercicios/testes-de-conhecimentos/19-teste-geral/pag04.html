<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background: url('imagens/fundo.jpg') no-repeat bottom center;
            background-size: cover;
            position: relative;
        }

        h1 {
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Iframes em Geral</h1>
    <div id="container">
        <iframe src="" frameborder="0"></iframe>
    </div>
</body>
</html>
